manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      revision: 0.3 # when changing zmk version, be sure to edit both here and in the .github/workflows/build.yml
      remote: zmkfirmware
      import: app/west.yml
  self:
    path: config
